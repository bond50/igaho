name: 30 - Deploy to Hostinger

# Migration complete — this is now the live auto-deploy path: every push
# to main builds + pushes to GHCR, then triggers infra-hostinger-v1's
# deploy workflow via repository_dispatch, with DNS pointed at Hostinger
# and the health check enabled (public DNS resolves there now).
#
# The AWS path (21-multiapp-web-autodeploy.yml) is untouched by this file
# and stays in the repo, manual-dispatch-only, in case of rollback.
#
# Manual workflow_dispatch runs still support overriding site_state/
# update_dns/health_check (e.g. to suspend the site, or to test something
# without touching DNS) — push-triggered runs always use the enabled/
# DNS-on/health-check-on defaults, regardless of those inputs' own
# defaults (GitHub Actions can't distinguish "input not provided" from
# "explicitly false" via a plain `||` fallback, so this is resolved
# explicitly in the "Resolve effective deploy settings" step below rather
# than in the trigger/input definitions themselves).

on:
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            site_state:
                description: "Site state to apply on Hostinger"
                type: choice
                options: ["enabled", "suspended", "removed"]
                default: "enabled"
            update_dns:
                description: "Point iganopda.org's real DNS at Hostinger?"
                type: boolean
                default: true
            health_check:
                description: "Run the post-deploy health check against the public domain?"
                type: boolean
                default: true

permissions:
    contents: read
    packages: write

concurrency:
    group: deploy-hostinger-igano
    cancel-in-progress: false

jobs:
    build-and-dispatch:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  platforms: linux/amd64
                  tags: |
                      ghcr.io/bond50/igaho:latest
                      ghcr.io/bond50/igaho:${{ github.sha }}
                  build-args: |
                      DATABASE_URL=postgresql://ci:ci@127.0.0.1:5432/ci?schema=public

            - name: Resolve effective deploy settings
              id: settings
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  INPUT_SITE_STATE: ${{ inputs.site_state }}
                  INPUT_UPDATE_DNS: ${{ inputs.update_dns }}
                  INPUT_HEALTH_CHECK: ${{ inputs.health_check }}
              shell: bash
              run: |
                  set -euo pipefail
                  if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
                    echo "site_state=${INPUT_SITE_STATE}" >> "$GITHUB_OUTPUT"
                    echo "update_dns=${INPUT_UPDATE_DNS}" >> "$GITHUB_OUTPUT"
                    echo "health_check=${INPUT_HEALTH_CHECK}" >> "$GITHUB_OUTPUT"
                  else
                    echo "site_state=enabled" >> "$GITHUB_OUTPUT"
                    echo "update_dns=true" >> "$GITHUB_OUTPUT"
                    echo "health_check=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Build dispatch payload
              id: payload
              env:
                  RUNTIME_SECURE_JSON: ${{ secrets.RUNTIME_SECURE_JSON }}
                  HOSTINGER_DB_PASSWORD: ${{ secrets.HOSTINGER_DB_PASSWORD }}
                  SITE_STATE: ${{ steps.settings.outputs.site_state }}
                  UPDATE_DNS: ${{ steps.settings.outputs.update_dns }}
                  HEALTH_CHECK: ${{ steps.settings.outputs.health_check }}
                  IMAGE_TAG: ${{ github.sha }}
              run: |
                  python3 - <<'PY'
                  import json, os
                  from urllib.parse import quote

                  env_json = json.loads(os.environ.get("RUNTIME_SECURE_JSON") or "{}")
                  # Only value that legitimately differs by hosting environment —
                  # everything else in RUNTIME_SECURE_JSON (Daraja, Cloudinary,
                  # OAuth, Resend) is environment-independent and reused as-is.
                  # Percent-encode the password: openssl rand -base64 can produce
                  # '/', '+', '=' which otherwise break URL parsing (hit this for
                  # real — Prisma failed with P1013 "invalid port number" because
                  # an unencoded '/' in the password split the URL wrong).
                  db_password = quote(os.environ["HOSTINGER_DB_PASSWORD"], safe="")
                  env_json["DATABASE_URL"] = (
                      f"postgresql://igano:{db_password}"
                      "@postgres:5432/igano?schema=public"
                  )

                  dns_records = []
                  if os.environ["UPDATE_DNS"] == "true":
                      dns_records = [
                          {"zone": "iganopda.org", "record_name": "@", "proxied": True},
                          {"zone": "iganopda.org", "record_name": "www", "proxied": True},
                      ]

                  # site_db is nested (not flat site_db_name/user/password) to
                  # stay under GitHub's 10-top-level-property limit for
                  # repository_dispatch client_payload.
                  payload = {
                      "site_name": "igano",
                      "site_image": f"ghcr.io/bond50/igaho:{os.environ['IMAGE_TAG']}",
                      "site_container_port": 3000,
                      "site_domain": "iganopda.org",
                      "site_state": os.environ["SITE_STATE"],
                      "site_db": {
                          "name": "igano",
                          "user": "igano",
                          "password": os.environ["HOSTINGER_DB_PASSWORD"],
                      },
                      "site_env_json": env_json,
                      "site_health_check_enabled": os.environ["HEALTH_CHECK"] == "true",
                      "cloudflare_dns_records": dns_records,
                  }

                  with open(os.environ["GITHUB_OUTPUT"], "a") as gh_out:
                      gh_out.write("payload<<PAYLOAD_EOF\n")
                      gh_out.write(json.dumps(payload))
                      gh_out.write("\nPAYLOAD_EOF\n")
                  PY

            - name: Trigger infra-hostinger-v1 deploy
              uses: peter-evans/repository-dispatch@v3
              with:
                  token: ${{ secrets.INFRA_DISPATCH_TOKEN }}
                  repository: bond50/infra-hostinger-v1
                  event-type: deploy-site
                  client-payload: ${{ steps.payload.outputs.payload }}
