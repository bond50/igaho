name: 21 - Multiapp Web Autodeploy

on:
  workflow_dispatch: # manual only — AWS is no longer the auto-deploy target
    # (see 30-deploy-hostinger.yml), kept for rollback capability

permissions:
  id-token: write
  contents: read

concurrency:
  group: autodeploy-${{ github.ref_name }}-igano
  cancel-in-progress: true

jobs:
  deploy:
    uses: bond50/infra-web-apps-v4/.github/workflows/41-app-autodeploy.yml@main
    with:
      app_slug: igano
      aws_role_arn: ${{ vars.AWS_ROLE_ARN }}
      aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      public_env_json: ${{ vars.PUBLIC_ENV_JSON || '' }}
      acme_email: ${{ vars.ACME_EMAIL || '' }}
      ecr_repo_name: igano-app
      container_port: ${{ vars.CONTAINER_PORT || '3000' }}
      domains_json: ${{ vars.DOMAINS_JSON || '' }}
      node_version: "24"
      docker_platform: linux/amd64
    secrets:
      runtime_secure_json: ${{ secrets.RUNTIME_SECURE_JSON }}
